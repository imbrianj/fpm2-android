apply plugin: 'com.android.application'

android {
    namespace 'org.braiden.fpm2'
    compileSdk 34

    defaultConfig {
        applicationId 'org.braiden.fpm2'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName '0.05'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'commons-lang:commons-lang:2.6'
}
